version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # Koneksi ke container ChromaDB di bawah
      - CHROMA_URL=http://chroma:8000
      # Karena Anda pakai Windows, gunakan "host.docker.internal"
      # untuk connect ke Ollama yang ada di komputer HOST Anda
      - OLLAMA_URL=http://host.docker.internal:11434
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - chroma
    extra_hosts:
      - "host.docker.internal:host-gateway"

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

volumes:
  chroma_data:
